apiVersion: apps/v1
kind: Deployment
metadata:
  name: chromadb
spec:
  selector:
    matchLabels:
      app: chromadb
  template:
    metadata:
      labels:
        app: chromadb
    spec:
      containers:
        - name: chromadb
          image: chromadb/chroma:latest
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: chromadb
spec:
  ports:
    - port: 8000
  selector:
    app: chromadb
